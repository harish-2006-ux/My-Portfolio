<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0d0d14;
      color: #f0f0f8;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      width: 100%; max-width: 400px;
      text-align: center;
    }
    .login-icon {
      width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #ff6b6b, #c77dff);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem;
    }
    p { color: #9999bb; font-size: 0.9rem; margin-bottom: 2rem; }
    input[type="password"] {
      width: 100%; padding: 0.9rem 1.2rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: #f0f0f8;
      font-size: 1rem; font-family: 'DM Sans', sans-serif;
      margin-bottom: 1rem; outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #c77dff; }
    button {
      width: 100%; padding: 0.9rem;
      background: linear-gradient(135deg, #ff6b6b, #c77dff);
      border: none; border-radius: 12px;
      color: white; font-size: 1rem; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
    .error {
      background: rgba(255,107,107,0.12);
      border: 1px solid rgba(255,107,107,0.3);
      color: #ff6b6b; border-radius: 10px;
      padding: 0.7rem 1rem; font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .back { margin-top: 1.5rem; }
    .back a { color: #9999bb; text-decoration: none; font-size: 0.85rem; }
    .back a:hover { color: #f0f0f8; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h1>Admin Login</h1>
    <p>Enter your password to manage portfolio content</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Enter password" autofocus/>
      <button type="submit">Login</button>
    </form>
    <div class="back"><a href="/">← Back to portfolio</a></div>
  </div>
</body>
</html>
